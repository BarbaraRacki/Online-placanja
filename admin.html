<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Administracija</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
</head>
<body class="admin">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <h1>Administracija</h1>
        <p class="muted small" id="who"></p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn small ghost" href="index.html">Trgovina</a>
      <button id="logoutBtn" class="btn small ghost" hidden>Odjava</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Nije postavljeno -->
    <section id="setupView" class="panel" hidden>
      <h2>Baza još nije povezana</h2>
      <p>Otvori datoteku <code>config.js</code> i upiši <code>supabaseUrl</code> i <code>supabaseAnonKey</code> iz Supabase projekta. Detaljne upute su u <code>README.md</code>.</p>
    </section>

    <!-- Prijava -->
    <section id="loginView" class="panel narrow-panel" hidden>
      <h2>Prijava</h2>
      <form id="loginForm">
        <label>Email<input name="email" type="email" required autocomplete="username"></label>
        <label>Lozinka<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary block" type="submit">Prijavi se</button>
      </form>
      <p class="muted small">Pristup ima samo administrator trgovine.</p>
    </section>

    <!-- Upravljanje -->
    <section id="manageView" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Pretraži…" aria-label="Pretraži">
        <button id="newBtn" class="btn primary">+ Novi proizvod</button>
      </div>
      <p class="muted small" id="stats"></p>
      <div id="list" class="admin-list"></div>
    </section>
  </main>

  <dialog id="editDlg" class="sheet">
    <form id="editForm" novalidate>
      <div class="sheet-head">
        <h2 id="editTitle">Novi proizvod</h2>
        <button type="button" class="icon-btn" data-close aria-label="Zatvori">✕</button>
      </div>
      <div class="img-pick">
        <div id="imgPreview" class="media big"></div>
        <div class="img-actions">
          <label class="btn small">Odaberi sliku<input id="imgInput" type="file" accept="image/*" hidden></label>
          <button type="button" id="imgRemove" class="link danger small" hidden>Ukloni sliku</button>
        </div>
      </div>
      <label>Naziv<input name="name" required maxlength="200"></label>
      <label>Cijena (EUR)<input name="price" required inputmode="decimal" placeholder="npr. 19,90"></label>
      <label>Opis<textarea name="description" rows="4" maxlength="5000"></textarea></label>
      <div class="two">
        <label>Redoslijed<input name="sort_order" type="number" step="1" value="0"></label>
        <label class="switch"><input name="active" type="checkbox" checked> Vidljiv u trgovini</label>
      </div>
      <div class="edit-actions">
        <button type="button" id="deleteBtn" class="btn ghost danger" hidden>Obriši</button>
        <button type="submit" id="saveBtn" class="btn primary grow">Spremi</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
